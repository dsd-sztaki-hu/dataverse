<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://java.sun.com/jsf/passthrough"
      xmlns:cc="http://java.sun.com/jsf/composite"
      xmlns:o="http://omnifaces.org/ui"
      xmlns:iqbs="http://xmlns.jcp.org/jsf/composite/iqbs">
    <h:head>
    </h:head>

    <h:body>
        <ui:composition>
            <c:set var="aromaIframeDomId" value="#{empty aromaIframeElementId ? 'iframeId' : aromaIframeElementId}"/>
            <c:set var="optionalApiKeyParameter" value="#{empty optionalApiKeyParameter ? '' : optionalApiKeyParameter}"/>
            <c:set var="optionalReadonlyParameter" value="#{empty optionalReadonlyParameter ? '' : optionalReadonlyParameter}"/>
            <div id="aromaEmbedWrap_#{aromaIframeDomId}" class="embed-responsive embed-responsive-16by9 aroma-embed-wrap"
                 data-aroma-address="#{aromaAddress}"
                 data-aroma-persistent-id="#{persistentId}"
                 data-aroma-language="#{language}"
                 data-aroma-version="#{version}"
                 data-aroma-focus="#{focus}"
                 data-aroma-focus-dataset="#{focusDataset}"
                 data-aroma-api-key-param="#{optionalApiKeyParameter}"
                 data-aroma-readonly-param="#{optionalReadonlyParameter}">
                <iframe id="#{aromaIframeDomId}" title="ARP AROMA" src="about:blank" data-aroma-embed="true"></iframe>
            </div>
        </ui:composition>
    </h:body>

</html>
