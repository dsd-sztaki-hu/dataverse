datasetfieldtype.ARCS1.title=1) Ezek közül az adatkészletek közül bármelyik a) megvásárolt, b) licencelt adatbázisból származó, vagy c) egy szervezettől titoktartási vagy más megállapodás alapján kapott?
datasetfieldtype.ARCS2.title=2) Ha az 1. kérdésre Igen a válasz, biztosította, hogy az adatok megosztása nem sérti a megállapodás feltételeit? Ha az 1. kérdésre Nem a válasz, kérjük, írjon be N/A értéket.
datasetfieldtype.ARCS3.title=3) Ezek közül az adatkészletek közül bármelyik tartalmaz-e egyéni szintű adatokat (akár gyűjtötteket, akár a meglévő adatkészlet részeként), amelyekre az USA vagy nemzetközi emberi alanyokra vonatkozó előírások vonatkozhatnak?
datasetfieldtype.ARCS4.title=4) Ha a 3. kérdésre Igen a válasz, ezek az adatkészletek teljesen anonimizáltak, vagy az intézményi etikai bizottság (IRB) jóváhagyta a megosztást? Ha a 3. kérdésre Nem a válasz, kérjük, írjon be N/A értéket.
datasetfieldtype.ARCS5.title=5) Tartalmaznak-e ezek az adatkészletek érzékeny vagy személyazonosításra alkalmas privát információkat? (A Harvard Research Data Security Policy {www.security.harvard.edu/research-data-security-policy} alkalmazható, mert ez a Dataverse a Harvard Universityn van hosztolva.)
