datasetfieldtype.sourceCHIA.description=Forrás – Ez az adatok forrását írja le. A Bureau of Labor and Statistics-től származik? Az ENSZ adatairól van szó?
datasetfieldtype.datesAdditionalInformationCHIA.description=Dátumok – további információk – Jegyezzen fel bármilyen további információt az adatkészletben szereplő dátumokról vagy időszakokról, beleértve az intervallumokat is (éves, évtizedes, évszázados stb.). Jelezze azt is, hogy az adatkészlet melyik oszlopa(i) tartalmazzák a dátumokat és egyéb időbeli információkat.
datasetfieldtype.variablesCHIA.description=Változók – Határozza meg az adatkészlet változóit. Kérjük, jelezze, hogy az adatkészlet melyik oszlopában találhatók a változóinformációk.
datasetfieldtype.classificationSchemaCHIA.description=Osztályozási séma – Ha van osztályozási séma az adatkészletben, kérjük, írja le. Például az M_20_24 azt jelenti: 20–24 éves férfiak.
datasetfieldtype.provenanceCHIA.description=Származás – Az adatkészletek származása a tulajdonosi nyilvántartás, és útmutatóként szolgál az adatok hitelességéhez vagy minőségéhez. Például a származási nyilatkozat lehet: „Ezt az adatkészletet David Ruvolo által 1992-ben, egy spanyolországi adatgyűjtő út során gyűjtött adatokból hozták létre. Azóta az adatokat nem módosították, kivéve a korszerűbb formátumokra történő migrálást.” 
datasetfieldtype.rightsAvailabilityCHIA.description=Jogok/hozzáférhetőség – Rendelkezik-e a jogosultsággal ezen adatok megosztására?
